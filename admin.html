<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kapeng Kabado Admin Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
    body {
    background: #f5f1eb;
    font-family: Inter, sans-serif;
    }
    .sidebar-gradient {
    background: linear-gradient(180deg,#2b1709,#5c3b24,#8b5e3c);
    }
    </style>
</head>
<body x-data="adminApp()">

<!-- Admin login removed: admin access enforced via session check -->

<div x-show="loggedIn" class="flex min-h-screen">

  <aside class="w-80 sidebar-gradient text-white p-8 hidden lg:block">
    <div class="flex items-center gap-4 mb-14">
      <div class="w-16 h-17 rounded-3xl bg-white/20 flex items-center justify-center text-3xl">
        <img src="assets/kapeng-kabado-logo.png" alt="logo">
      </div>

      <div>
        <h1 class="text-3xl font-black">Kapeng Kabado</h1>
        <p class="text-amber-100">Admin Dashboard</p>
      </div>
    </div>

    <nav class="space-y-3">
      <a href="#" class="flex items-center gap-4 bg-white/10 px-5 py-4 rounded-2xl font-bold">
        <i class="fa-solid fa-chart-line"></i>
        Dashboard
      </a>

      <a href="#" class="flex items-center gap-4 hover:bg-white/10 px-5 py-4 rounded-2xl font-bold transition">
        <i class="fa-solid fa-box"></i>
        Products
      </a>

      <a href="#" class="flex items-center gap-4 hover:bg-white/10 px-5 py-4 rounded-2xl font-bold transition">
        <i class="fa-solid fa-cart-shopping"></i>
        Orders
      </a>

      <a href="#" class="flex items-center gap-4 hover:bg-white/10 px-5 py-4 rounded-2xl font-bold transition">
        <i class="fa-solid fa-users"></i>
        Customers
      </a>

      <a href="#" class="flex items-center gap-4 hover:bg-white/10 px-5 py-4 rounded-2xl font-bold transition">
        <i class="fa-solid fa-credit-card"></i>
        Payments
      </a>
    </nav>
  </aside>

  <main class="flex-1 p-8">
    <div class="flex items-center justify-between mb-10">
      <div>
        <h1 class="text-5xl font-black">Coffee Analytics</h1>
        <p class="text-gray-500 mt-3">Manage your coffee business system.</p>
      </div>

      <button
        @click="logout()"
        class="bg-red-500 text-white px-6 py-3 rounded-2xl font-bold hover:bg-red-600"
      >
        Logout
      </button>
    </div>

    <div class="grid md:grid-cols-4 gap-6 mb-10">
      <div class="bg-white rounded-3xl p-7 shadow-xl">
        <p class="text-gray-500">Revenue</p>
        <h2 class="text-5xl font-black mt-3">₱82K</h2>
      </div>

      <div class="bg-white rounded-3xl p-7 shadow-xl">
        <p class="text-gray-500">Orders</p>
        <h2 class="text-5xl font-black mt-3">524</h2>
      </div>

      <div class="bg-white rounded-3xl p-7 shadow-xl">
        <p class="text-gray-500">Customers</p>
        <h2 class="text-5xl font-black mt-3">1.2K</h2>
      </div>

      <div class="bg-white rounded-3xl p-7 shadow-xl">
        <p class="text-gray-500">Products</p>
        <h2 class="text-5xl font-black mt-3">150</h2>
      </div>
    </div>

    <div class="bg-white rounded-[40px] shadow-2xl overflow-hidden">
      <div class="p-8 border-b">
        <h2 class="text-3xl font-black">Latest Orders</h2>
      </div>

      <table class="w-full">
        <thead class="bg-amber-700 text-white">
          <tr>
            <th class="p-5 text-left">Order ID</th>
            <th class="p-5 text-left">Customer</th>
            <th class="p-5 text-left">Product</th>
            <th class="p-5 text-left">Status</th>
            <th class="p-5 text-left">Price</th>
          </tr>
        </thead>

        <tbody>
          <template x-for="order in orders">
            <tr class="border-b hover:bg-gray-50">
              <td class="p-5" x-text="order.id"></td>
              <td class="p-5" x-text="order.customer"></td>
              <td class="p-5" x-text="order.item"></td>
              <td class="p-5">
                <span class="bg-green-100 text-green-700 px-4 py-2 rounded-full text-xs font-bold" x-text="order.status"></span>
              </td>
              <td class="p-5">₱<span x-text="order.price"></span></td>
            </tr>
          </template>
        </tbody>
      </table>
    </div>
  </main>
</div>
<script type="text/plain" id="admin-template"></script>
<script>
function adminApp() {
  const SESSION_KEY = 'kk_session';

  return {
    loggedIn: false,

    orders: JSON.parse(localStorage.getItem('orders')) || [],

    logout() {
      this.loggedIn = false;
      localStorage.removeItem(SESSION_KEY);
      // redirect back to public login
      window.location.href = 'login.html';
    },

    init() {
      try {
        const sess = JSON.parse(localStorage.getItem(SESSION_KEY));
        if (sess && sess.loggedIn && sess.isAdmin) {
          this.loggedIn = true;
          return;
        }
      } catch(e) {
        // ignore parse errors
      }
      // Not an admin — redirect to public login and request admin redirect back
      window.location.href = 'login.html?from=admin.html';
    }
  }
}
</script>

</body>
</html>
</script>
